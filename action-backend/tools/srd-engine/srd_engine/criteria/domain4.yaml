# 领域 4：研究质量（非关键领域）判定口径

9a:
  dup_when: |
    两篇在三点上实质一致：① 是否披露本综述作者的利益冲突与资助来源；
    ② 是否识别并报告了纳入研究的利益冲突/资助等潜在偏倚来源；
    ③ 对这些因素是否可能影响结果，给出的总体判断实质相同
    （如都认为不足以改变结论，或都认为构成重要局限）。
  diff_when: |
    一篇系统评估并讨论了纳入研究的资助来源与利益冲突及其对结果的潜在影响，
    另一篇完全未涉及；或两篇对同类信息给出的影响判断实质相反
    （一篇认为存在重要偏倚风险、另一篇认为无实质影响）。
  unclear_when: |
    任一篇既未披露自身利益冲突，也未提及纳入研究的偏倚来源，无从比较。

10a:
  dup_when: |
    两篇使用同一种偏倚风险评估工具（都用 RoB 2，或都用 Cochrane RoB 1，或都用 ROBINS-I）。
  diff_when: |
    使用的工具不同（如 A 用 RoB 2、B 用 Cochrane RoB 1 或 Jadad 量表），
    或一篇做了偏倚风险评估而另一篇完全未做。
  unclear_when: |
    任一篇未说明使用了何种偏倚风险评估方法。
  note: |
    本条目问的是「用了什么方法」。两篇用同一种方法即为一致（重复），
    不需要额外判断评估结果是否相同——那是 10b。

10b:
  dup_when: |
    两篇对证据体总体偏倚水平的判断实质相同
    （如都认为多数纳入研究存在高偏倚风险、主要问题都集中在盲法与分配隐藏），
    且对该偏倚水平如何影响结论的表述相似。
  diff_when: |
    总体判断实质不同（一篇认为证据体总体偏倚风险低至中等、另一篇认为多数研究高风险），
    或对同一批研究的关键偏倚领域识别不同。
  unclear_when: |
    任一篇未给出对总体偏倚水平的判断，仅列出逐条评级而无汇总表述且无法归纳。

'11':
  dup_when: |
    两篇对「缺失结果导致的偏倚」（发表偏倚、选择性报告）的评估结论实质相同——
    在是否存在此类偏倚、以及是否足以影响结论上给出同向判断
    （如都基于漏斗图/Egger 检验认为无明显发表偏倚，或都因研究数过少而未评估并同样声明这是局限）。
  diff_when: |
    结论实质不同（一篇提示存在发表偏倚并据此下调证据确定性、另一篇认为无证据表明存在发表偏倚），
    或一篇做了评估而另一篇完全未涉及。
  unclear_when: |
    任一篇未提及缺失结果导致的偏倚。

12a:
  dup_when: |
    两篇使用同一种证据总结方法（都使用 GRADE，或都使用同一种非 GRADE 的证据总结框架，
    或都明确未使用任何正式的证据分级方法）。
  diff_when: |
    方法不同（如 A 使用 GRADE 并给出证据概要表、B 未使用任何正式的证据确定性评价方法）。
  unclear_when: |
    任一篇未说明其证据总结方法。
  note: |
    本条目问的是「用了什么方法」。两篇都用 GRADE 即为一致（重复），
    评级结果是否相同由 12b 判断。

12b:
  dup_when: |
    对可比较的关键结局，两篇给出的证据确定性等级相同或仅差一级且降级原因相同，
    且对证据总体强度的文字表述实质一致。
  diff_when: |
    对同一关键结局的证据确定性等级差异明显（如 A 评为「中等」、B 评为「极低」），
    或降级原因构成不同（A 主因不精确性、B 主因偏倚风险与不一致性）。
  unclear_when: |
    任一篇未给出关键结局的证据确定性评级，或两篇没有可比较的关键结局。
