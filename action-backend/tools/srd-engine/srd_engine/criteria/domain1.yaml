# 领域 1：研究主题（关键领域）判定口径
#
# 口径写法要求：dup_when / diff_when 必须是**可观察的差异描述**，
# 不能是「很相似 / 较相似」这类同义反复，否则模型只能靠语感猜。
# examples 待金标准集建立后回填（DESIGN.md §11）。
#
# 与 0–3 评分的对应（0.7.0 起）：
#   dup_when     → 0 分（完全相同）的锚点
#   diff_when    → 3 分（完全不同）的锚点
#   unclear_when → 证据不足，不计分
#   1 分 / 2 分是两个锚点之间的中间档，由 prompts.py 里的通用档位定义统一给出
#   （判据是「差异会不会改变临床或方法学解读」——各条目 yaml 里本来就在用这个尺子）。
#   哪条目的中间档需要专属锚点，等金标准集建立后再逐条回填到这里。

1a:
  dup_when: |
    两篇都陈述了本综述回应的决策/临床需求，且所指向的需求实质相同
    （例如都指向「现有指南对针刺治疗慢性腰痛的推荐证据不足，需要更新的合成证据」）；
    或两篇都明确以「更新既有综述 / 回应同一份指南或政策问题」为由立题。
  diff_when: |
    两篇陈述的决策需求指向不同的问题或不同的决策者
    （例如 A 为临床指南更新提供证据、B 为卫生技术评估的成本效果分析提供疗效参数），
    或一篇明确以更新既有综述立题、另一篇则是回应全新的临床问题。
  unclear_when: |
    任一篇未陈述立题背后的决策需求，只笼统写「针刺疗效仍存争议，故开展本综述」，
    无法据以比较。
  note: |
    本条目问的是「立题动机是否指向同一决策需求」，不是「研究问题是否相同」（那是 1b）。

1b:
  dup_when: |
    两篇的研究目标在 PICO 层面指向同一件事——同类人群、同类干预、同类比较、同类结局，
    即一名读者会认为两篇在回答同一个问题。
  diff_when: |
    研究目标在 PICO 任一要素上指向不同对象
    （如 A 评价针刺对慢性腰痛的镇痛效果、B 评价针刺对术后恶心呕吐的预防效果），
    或一篇是疗效评价、另一篇是安全性/成本/机制评价。
  unclear_when: |
    任一篇未明确陈述研究目标，仅有标题可推断。
  note: |
    目标表述用词不同但所指相同（"efficacy" vs "effectiveness"）不构成 diff。

2a:
  dup_when: |
    纳入人群的疾病/状态定义、关键限定条件（年龄段、病程、严重度、合并症、诊断标准）
    在临床意义上无实质差异——即同一批患者会同时满足两篇的纳入标准。
  diff_when: |
    疾病/状态定义不同（如「非特异性下背痛」vs「腰椎间盘突出症」），
    或关键限定条件差异大到会改变纳入人群构成
    （如 A 限成人、B 含儿童；A 限病程≥12 周的慢性、B 含急性期）。
  unclear_when: |
    任一篇未报告人群纳入标准细节，仅写「腰痛患者」而无诊断或病程界定。

2b:
  dup_when: |
    针刺类型（手针/电针/温针/耳针/穴位埋线/激光针…）、主要穴位方案、
    剂量参数（疗程、频次、留针时间）在临床意义上无实质差异——
    即一名针灸临床医生会认为两篇在评价「同一种治疗」。
  diff_when: |
    针刺类型不同（如手针 vs 电针），或核心穴位组无交集，
    或剂量差异大到会改变临床解读（如 4 周 vs 12 周疗程、每周 1 次 vs 每周 3 次）。
  unclear_when: |
    任一篇仅笼统称「针刺治疗」，未报告针刺类型或剂量参数，无法比较。
  note: |
    「一篇限定电针、另一篇允许任何针刺形式（含电针）」属于范围包含关系，
    判 diff（纳入的干预总体不同），并在理由中说明是包含而非互斥。

2c:
  dup_when: |
    对照措施的类型与实施方式实质相同（都为假针刺，或都为常规治疗/等待名单，
    或都为同一类阳性药物对照）。
  diff_when: |
    对照类型不同（假针刺 vs 等待名单 vs 药物阳性对照），
    或同为假针刺但实施方式差异会改变解释（非穿透安慰针 vs 非穴位浅刺）。
  unclear_when: |
    任一篇未报告对照措施，或仅写「对照组」而无内容。

2d:
  dup_when: |
    两篇关注的结局指标集合实质重合——主要结局相同，
    且次要结局的覆盖范围无本质差异（量表名称不同但测量同一构念，如 VAS 与 NRS 同为疼痛强度，视为相同）。
  diff_when: |
    主要结局不同（如 A 以疼痛强度为主要结局、B 以功能障碍为主要结局），
    或结局集合几乎无交集，或一篇只评疗效、另一篇只评安全性。
  unclear_when: |
    任一篇未区分主要/次要结局且未列出结局清单。

2e:
  dup_when: |
    纳入的研究设计类型相同（都只纳入 RCT，或都纳入 RCT + 非随机干预研究）。
  diff_when: |
    设计类型不同（A 只纳入 RCT、B 同时纳入队列研究/单臂研究），
    或一篇限定平行组 RCT、另一篇纳入交叉设计。
  unclear_when: |
    任一篇未说明纳入的研究设计类型。

2f:
  dup_when: |
    综述的范围限制实质一致——地域、发表语言、发表年限、医疗场景（住院/门诊/社区）
    的限定不存在会明显改变可纳入研究池的差异。
  diff_when: |
    范围限制存在实质差异（如 A 仅限中国大陆发表、B 无地域限制；
    A 仅纳入英文文献、B 中英文均纳入；A 限 2010 年后、B 建库至今）。
  unclear_when: |
    两篇均未报告地域/语言/年限/场景等范围限制，无从比较。
  note: |
    「两篇都明确声明无语言与地域限制」属于 present=no 的一致情形，判 dup。
