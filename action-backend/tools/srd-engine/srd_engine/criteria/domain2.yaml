# 领域 2：研究方法（非关键领域）判定口径

3a:
  dup_when: |
    两篇检索的信息来源集合高度重合——核心国际数据库（PubMed/MEDLINE、Embase、CENTRAL）
    与中文数据库（CNKI、WanFang、VIP、SinoMed）的覆盖无实质缺口，
    且在「是否额外检索试验注册库/灰色文献」上做法一致。
  diff_when: |
    一篇遗漏了另一篇覆盖的核心数据库（如 A 检索 Embase 而 B 未检索），
    或一篇检索了中文数据库而另一篇完全未检索，
    或在是否检索试验注册库/灰色文献上做法不同。
  unclear_when: |
    任一篇未列出检索的数据库名称。
  note: |
    提示词中会附带代码算好的「客观事实」卡（交并集与 Jaccard），
    请以该客观事实为准做判断，不要自行从原文重新数据库清单。

3b:
  dup_when: |
    检索式的结构实质相同——概念块（人群 / 干预 / 设计）的数量与组合方式一致，
    在是否使用主题词（MeSH/Emtree）、是否使用研究设计过滤器上做法一致，
    且检索时间范围无实质差异。
  diff_when: |
    概念块构成不同（如 A 用「人群 AND 干预 AND RCT 过滤器」、B 只用「干预 AND 人群」），
    或一篇使用主题词+自由词而另一篇仅用标题摘要自由词，
    或检索时间范围差异大到会改变可纳入研究池（如截止 2018 vs 截止 2024）。
  unclear_when: |
    任一篇未报告检索式结构，也未提供检索策略附录的描述。

4a:
  dup_when: |
    数据来源类型一致——都仅取自已发表论文全文，
    或都同时使用了试验注册记录/向作者索取的补充数据/个体患者数据。
  diff_when: |
    一篇仅用已发表全文，另一篇额外使用了试验注册记录、会议摘要或向作者索取的数据，
    或一篇使用个体患者数据（IPD）而另一篇为聚合数据。
  unclear_when: |
    任一篇未说明数据从何而来。

4b:
  dup_when: |
    提取的数据字段范围实质一致——研究特征、人群特征、干预细节、结局数据、偏倚风险条目
    的覆盖无明显缺口。
  diff_when: |
    提取字段范围存在实质差异（如 A 额外提取了针刺剂量参数、不良事件与依从性，
    B 仅提取主要结局的效应值），会影响后续可做的分析。
  unclear_when: |
    任一篇未说明提取了哪些数据。

5a:
  dup_when: |
    对两篇共同关注的结局，其数据类型（二分类 / 连续 / 计数 / 生存 / 等级）判定一致。
  diff_when: |
    对同一结局采用了不同的数据类型处理（如疼痛缓解 A 按连续变量、B 二分为「缓解/未缓解」）。
  unclear_when: |
    任一篇未说明结局的数据类型，或两篇没有共同结局可比较。

5b:
  dup_when: |
    对共同结局选择的效应指标相同（都用 MD，或都用 SMD，或都用 RR）。
    注：MD 与 SMD 属于不同选择，不视为相同。
  diff_when: |
    对同一结局选择了不同效应指标（如 A 用 SMD、B 用 MD；A 用 RR、B 用 OR）。
  unclear_when: |
    任一篇未说明所用效应指标，或两篇没有共同结局可比较。
