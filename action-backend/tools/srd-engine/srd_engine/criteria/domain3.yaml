# 领域 3：研究结果（关键领域）判定口径

6a:
  dup_when: |
    两篇纳入研究的重叠比例高（提示词会给出代码算好的交并集与 Jaccard），
    通常 Jaccard ≥ 0.5 即认为纳入的证据体实质相同；
    或虽 Jaccard 略低，但两篇的核心大样本研究（决定合并结论的那几项）完全重合。
  diff_when: |
    交集研究很少（Jaccard 明显偏低），或一篇纳入的研究几乎全部不在另一篇的纳入清单中，
    或虽有交集但各自的主导性研究不同，会导致合并结论建立在不同证据体上。
  unclear_when: |
    任一篇的纳入研究清单未能完整获取（抽取数量与原文自述的纳入研究数不符），无法可靠比较。
  note: |
    本条目是重复性最直接的证据。请以提示词中「客观事实」卡给出的交并集为准，
    不要自行从原文重新数纳入研究数量。

6b:
  dup_when: |
    两篇在「是否提供纳入研究基本特征汇总」上做法一致——都提供了特征表/特征段落，
    或都明确未提供。
  diff_when: |
    一篇提供了完整的纳入研究特征表，另一篇未提供或仅有零散描述。
  unclear_when: |
    任一篇无法判断是否有特征汇总。

6c:
  dup_when: |
    两篇在「是否比较各研究特征以判断可否合并」上做法一致，
    且所依据的相似性维度实质相同（如都以人群、干预剂量、结局测量时点作为可合并性的判断依据）。
  diff_when: |
    一篇明确讨论了各研究间的临床与方法学异质性并据以决定分组合并，
    另一篇直接合并未做此评估；或两篇据以判断的维度不同。
  unclear_when: |
    任一篇未提及是否评估过研究间的可合并性。

6d:
  dup_when: |
    两篇对同一研究内多重性（多臂、多时点、多量表、多亚组）的处理方式实质相同
    （如都取主要时点、都合并多臂的对照组、都优先选取预设的主量表），或都明确未遇到多重性问题。
  diff_when: |
    处理方式不同（如 A 将多臂研究的各干预臂分别纳入、B 合并对照组；
    A 取末次随访、B 取治疗结束即刻），会导致纳入合并的数据不同。
  unclear_when: |
    任一篇未说明如何处理多重性。

6e:
  dup_when: |
    数据合成方法实质相同（都做 meta 分析，或都因异质性过大改为叙述性综合/SWiM）。
  diff_when: |
    一篇做了 meta 分析，另一篇仅做叙述性综合或 vote counting；
    或一篇做网状 meta 分析、另一篇做成对 meta 分析。
  unclear_when: |
    任一篇未说明合成方法。

7a:
  dup_when: |
    异质性处理方法实质相同——在是否报告 I²/Q 检验、是否用随机效应模型应对异质性、
    是否报告 τ² 或预测区间上做法一致。
  diff_when: |
    处理方法不同（如 A 报告 I² 并以随机效应模型合并、B 未评估异质性直接用固定效应；
    或 A 设定 I²>50% 即改为叙述性综合、B 无此规则）。
  unclear_when: |
    任一篇未说明如何处理异质性，且未报告任何异质性统计量。
  note: |
    两篇都明确说明「未评估异质性」属于做法一致，判 dup。

7b:
  dup_when: |
    亚组分析的变量集合实质一致（如都按针刺类型、疗程、对照类型分层），
    或两篇都明确未做亚组分析。
  diff_when: |
    亚组变量集合差异明显（如 A 按针刺类型与病程分层、B 按国家与发表语言分层），
    或一篇做了亚组分析而另一篇完全未做。
  unclear_when: |
    任一篇未说明是否做过亚组分析。

7c:
  dup_when: |
    缺失数据处理方式实质相同（如都仅用可获得数据分析、都做同样的插补、
    都以同样规则从图/中位数换算），或两篇都明确未遇到缺失数据。
  diff_when: |
    处理方式不同（如 A 对缺失标准差用相关系数插补、B 直接排除该研究；
    A 做意向性分析、B 做符合方案分析）。
  unclear_when: |
    任一篇未说明缺失数据的处理方式。

7d:
  dup_when: |
    敏感性分析策略实质相同（如都以「排除高偏倚风险研究」「更换效应模型」作为敏感性分析），
    或两篇都明确未做敏感性分析。
  diff_when: |
    策略不同（如 A 只做「排除小样本研究」、B 做「更换效应模型 + 排除高偏倚风险研究」），
    或一篇做了而另一篇完全未做。
  unclear_when: |
    任一篇未说明是否做过敏感性分析。

8a:
  dup_when: |
    对共同结局所用的统计模型相同（都用随机效应模型，或都用固定效应模型），
    且估计方法（DerSimonian-Laird / REML / Mantel-Haenszel / Hartung-Knapp 校正）
    不存在会改变结论的差异。
  diff_when: |
    模型选择不同（A 随机效应、B 固定效应），或估计方法差异明显
    （如一篇使用 Hartung-Knapp 校正而另一篇未用，导致置信区间宽度明显不同）。
  unclear_when: |
    任一篇未说明所用统计模型，或两篇没有共同结局可比较。

8b:
  dup_when: |
    对共同结局，合并效应的方向一致、效应量大小接近、置信区间大体重叠——
    即两篇给出的是同一个定量答案。
  diff_when: |
    方向相反，或虽方向一致但效应量差异大到会改变临床解读
    （如一篇跨过最小临床重要差值而另一篇未跨过），或置信区间几乎不重叠
    （一篇显著、另一篇不显著）。
  unclear_when: |
    任一篇未报告可比较的合并效应量，或两篇没有共同结局。
  note: |
    提示词会附带代码算好的「客观事实」卡（逐结局的方向一致性、点估计比、置信区间重叠度）。
    请以该客观事实为准，不要自行从原文重新读数。

8c:
  dup_when: |
    两篇对干预效应方向（有益 / 无效 / 有害）的定性判断相同，
    且对效应大小的临床意义表述实质相似（都称「小而具临床意义」，或都称「差异未达临床重要水平」）。
  diff_when: |
    方向判断不同（一篇称针刺优于对照、另一篇称无差异），
    或虽方向相同但临床意义表述实质不同（一篇称「效应虽显著但幅度小于最小临床重要差值」、
    另一篇称「具有明确临床价值」）。
  unclear_when: |
    任一篇未给出对效应方向或大小的解释性表述。

8d:
  dup_when: |
    两篇对结果外推范围的判断实质相似——对可适用的人群、场景、针刺实施条件
    给出的限定条件相同，或都明确指出同类外推局限。
  diff_when: |
    外推判断实质不同（如 A 认为结果可推广至基层与社区场景、B 强调仅适用于有资质针灸师的
    专科门诊；或 A 认为可外推至各类慢性疼痛、B 明确限定于所研究的单一病种）。
  unclear_when: |
    任一篇未讨论结果的适用性或普适性。

8e:
  dup_when: |
    两篇的总体结论实质相同（对「针刺是否应被推荐」给出同向答案与同等强度的表述），
    且未来研究建议指向相似的缺口（如都呼吁开展更大样本、更长随访、标准化针刺方案的试验）。
  diff_when: |
    结论实质不同（一篇支持临床推荐、另一篇认为证据不足以支持推荐），
    或结论同向但建议指向的研究缺口明显不同。
  unclear_when: |
    任一篇未给出明确结论或建议。
