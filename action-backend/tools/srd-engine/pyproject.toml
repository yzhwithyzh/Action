[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srd-engine"
version = "0.6.0"
description = "SRD (Systematic Review Duplication) assessment engine — LangChain based, backend-agnostic"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "langchain-core>=0.3.60",
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
anthropic = ["langchain-anthropic>=0.3"]
google = ["langchain-google-genai>=2.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
srd = "srd_engine.cli:main"

[tool.setuptools.packages.find]
include = ["srd_engine*"]

[tool.setuptools.package-data]
srd_engine = ["criteria/*.yaml", "vocab/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
